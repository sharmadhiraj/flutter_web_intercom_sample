<!doctype html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flutter_web_intercom_sample">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>flutter_web_intercom_sample</title>
  <link rel="manifest" href="manifest.json">

  <script>
    var APP_ID = "YOUR_INTERCOM_APP_ID";
    window.intercomSettings = {
      app_id: APP_ID,
      hide_default_launcher: true,
    };

    (function () {
      var w = window;
      if (typeof w.Intercom === "function") {
        w.Intercom("reattach_activator");
        w.Intercom("update", w.intercomSettings);
        return;
      }
      var intercom = function () {
        intercom.c(arguments);
      };
      intercom.q = [];
      intercom.c = function (args) {
        intercom.q.push(args);
      };
      w.Intercom = intercom;

      function loadWidget() {
        var script = document.createElement("script");
        script.async = true;
        script.src = "https://widget.intercom.io/widget/" + APP_ID;
        document.head.appendChild(script);
      }
      if (document.readyState === "complete") {
        loadWidget();
      } else {
        w.addEventListener("load", loadWidget, false);
      }
    })();

    function setIntercomLauncherVisible(visible) {
      Intercom("update", { hide_default_launcher: !visible });
    }

    function openIntercomMessenger() {
      Intercom("show");
    }
  </script>

</head>
<body>
<script async src="flutter_bootstrap.js"></script>
</body>
</html>
